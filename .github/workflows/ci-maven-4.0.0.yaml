name: Java Tests Maven 4.0.0-rc-7 with java 25

on: [push, pull_request]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  maven-sha256: 6ef648cbd5d06c4669fb43256b2fd03954019d97ab4f42fdfaa0a2d46ede9f2e
  maven-version: 4.0.0-rc-7

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Tests Maven 4.0.0-rc-7 with java 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          cache: maven
          distribution: zulu
          java-version: 25
      - name: Set Maven Wrapper version ${{ env.maven-version }}
        run: |
          sed -i "s|org/apache/maven/apache-maven/[^/]*/|org/apache/maven/apache-maven/${{ env.maven-version }}/|" .mvn/wrapper/maven-wrapper.properties
          sed -i "s|apache-maven-[^/]*-bin.zip|apache-maven-${{ env.maven-version }}-bin.zip|" .mvn/wrapper/maven-wrapper.properties
          sed -i "s|^distributionSha256Sum=.*|distributionSha256Sum=${{ env.maven-sha256 }}|" .mvn/wrapper/maven-wrapper.properties
      - name: Test with Maven ${{ env.maven-version }}
        run: ./mvnw test --batch-mode --no-transfer-progress --show-version -Dlicense.skip=true -Dmaven=${{ env.maven-version }} -Dmaven.min-version=${{ env.maven-version }}
